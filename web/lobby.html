<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Salons zombies</title>
  <style>
    :root { --bg: #0d0f0e; --panel: #171a18; --line: #2a2f2b; --text: #e8e4d8; --muted: #9a9888; --accent: #c8402c; --accent-text: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 28px; letter-spacing: .02em; margin: 0 0 4px; }
    h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 32px 0 12px; }
    p.lead { color: var(--muted); margin: 0 0 8px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
    input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
    .grid .wide { grid-column: 1 / -1; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    button { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    li:first-child { border-top: 0; }
    li .room { flex: 1; min-width: 0; }
    li .room strong { display: block; overflow-wrap: anywhere; }
    li .room span { color: var(--muted); font-size: 14px; }
    .empty, .note { color: var(--muted); font-size: 14px; }
    .invited { border-color: var(--accent); }
    #status { min-height: 1.5em; font-size: 14px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Salons zombies</h1>
    <p class="lead">Le premier joueur d'un salon en est l'hôte ; les autres le rejoignent directement depuis leur navigateur.</p>

    <section id="invitation" class="invited" hidden>
      <strong id="invitation-title"></strong>
      <p class="note" id="invitation-note"></p>
      <div class="actions"><button class="primary" id="invitation-join" hidden>Rejoindre</button></div>
    </section>

    <h2>Ton pseudo</h2>
    <section>
      <label for="pseudo">Lettres, chiffres, _ et -, 15 caractères au plus</label>
      <input id="pseudo" maxlength="15" autocomplete="nickname" placeholder="Unknown Soldier">
    </section>

    <h2>Salons ouverts</h2>
    <section>
      <ul id="rooms"></ul>
      <p class="empty" id="empty">Aucun salon ouvert pour l'instant.</p>
    </section>

    <h2>Créer un salon</h2>
    <section>
      <div class="grid">
        <div><label for="room">Nom du salon</label><input id="room" maxlength="40"></div>
        <div><label for="map">Carte</label><select id="map"></select></div>
      </div>
      <div class="actions">
        <button class="primary" id="create">Créer et jouer</button>
        <button id="copy">Copier le lien d'invitation</button>
      </div>
      <p id="status" role="status"></p>
    </section>
  </main>
  <script type="module">
    const MAPS = {
      nacht: 'Nacht der Untoten', kino: 'Kino der Toten', five: '"Five"', riese: 'Der Riese', verruckt: 'Verrückt',
      shinonuma: 'Shi No Numa', ascension: 'Ascension', cotd: 'Call of the Dead', shangrila: 'Shangri-La', moon: 'Moon',
    };
    const $ = id => document.getElementById(id);
    const invited = new URLSearchParams(location.search).get('room');
    const play = (map, room) => { location.href = `/bo1z/${map}?room=${encodeURIComponent(room)}`; };
    const clean = text => text.replace(/[^\w-]/g, '').slice(0, 15);

    for (const [id, label] of Object.entries(MAPS)) $('map').append(new Option(id === 'nacht' ? `${label} (testée)` : label, id));
    $('room').placeholder = `salon-${crypto.randomUUID().slice(0, 4)}`;
    $('room').value = invited ?? $('room').placeholder;
    const roomName = () => $('room').value.trim() || $('room').placeholder;
    try { $('pseudo').value = localStorage.getItem('bo1z-name') ?? ''; } catch {}
    $('pseudo').addEventListener('input', () => {
      $('pseudo').value = clean($('pseudo').value);
      try { localStorage.setItem('bo1z-name', $('pseudo').value); } catch {}
    });

    $('create').onclick = () => play($('map').value, roomName());
    $('copy').onclick = async () => {
      const link = `${location.origin}/?room=${encodeURIComponent(roomName())}`;
      try { await navigator.clipboard.writeText(link); $('status').textContent = `Lien copié : ${link}`; }
      catch { $('status').textContent = link; }
    };

    function show(rooms) {
      $('rooms').replaceChildren(...rooms.map(({ name, map, players }) => {
        const item = document.createElement('li');
        const info = document.createElement('div');
        info.className = 'room';
        info.append(Object.assign(document.createElement('strong'), { textContent: name }),
          Object.assign(document.createElement('span'), { textContent: `${MAPS[map] ?? map} · ${players} joueur${players > 1 ? 's' : ''}` }));
        const join = Object.assign(document.createElement('button'), { textContent: 'Rejoindre', onclick: () => play(map, name) });
        item.append(info, join);
        return item;
      }));
      $('empty').hidden = rooms.length > 0;
      if (!invited) return;
      const room = rooms.find(({ name }) => name === invited);
      $('invitation').hidden = false;
      $('invitation-title').textContent = `Invitation au salon « ${invited} »`;
      $('invitation-note').textContent = room
        ? `${MAPS[room.map] ?? room.map}, ${room.players} joueur${room.players > 1 ? 's' : ''}. Choisis ton pseudo puis rejoins la partie.`
        : "Ce salon n'est pas encore ouvert : attends que l'hôte lance sa partie.";
      $('invitation-join').hidden = !room;
      $('invitation-join').onclick = () => play(room.map, invited);
    }

    async function refresh() {
      try { show(await (await fetch('/rooms', { cache: 'no-store' })).json()); } catch {}
      setTimeout(refresh, 2000);
    }
    refresh();
  </script>
</body>
</html>
