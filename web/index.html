<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <base href="/bo1z/">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Zombies</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" crossorigin>
  <link rel="stylesheet" href="menu.css">
  <script type="module" src="menu.js"></script>
</head>
<body>
  <div class="bg"><div></div><div></div></div>
  <div class="shade"></div>
  <div class="grain"></div>

  <div class="app">
    <header>
      <div class="logo">ZOMBIES<span>.</span><small>BLACK OPS · DANS TON NAVIGATEUR</small></div>
      <div class="spacer"><div class="toast" id="toast" role="status"></div></div>
      <div class="chip"><label for="pseudo">Pseudo</label><input id="pseudo" maxlength="15" placeholder="Unknown Soldier" autocomplete="nickname"></div>
      <button class="ghost" id="paste" type="button">Coller un lien d’invitation</button>
    </header>

    <main>
      <nav class="maps" id="maps" aria-label="Cartes"></nav>

      <section class="detail" aria-live="polite">
        <div class="shot" id="shot" role="img"></div>
        <div class="kicker" id="kicker"></div>
        <h1 id="name"></h1>
        <div class="place" id="place"></div>
        <p class="desc" id="desc"></p>
        <div class="tags" id="tags"></div>
        <div class="actions">
          <button class="play" id="play" type="button">JOUER EN SOLO</button>
          <button class="switch" id="hell" type="button" role="switch" aria-checked="false"><i></i>Mode Enfer</button>
        </div>
      </section>

      <aside class="lobby" aria-label="Multijoueur">
        <h2>Salons <small id="count"></small></h2>
        <div class="rooms" id="rooms"></div>
        <p class="note" id="hell-note" hidden>Mode Enfer : en solo seulement pour l’instant.</p>
        <form class="create" id="create">
          <input id="room" maxlength="40" aria-label="Nom du salon" autocomplete="off">
          <button class="ghost" type="submit">Créer un salon</button>
        </form>
      </aside>
    </main>

    <footer>
      <span><kbd>↑</kbd><kbd>↓</kbd>Choisir</span>
      <span><kbd>Entrée</kbd>Jouer</span>
      <span><kbd>E</kbd>Mode Enfer</span>
      <span><kbd>S</kbd>Salons</span>
      <span class="credits">Moteur KisakBlack (GPL-3.0) · portage web vel.gg</span>
    </footer>
  </div>

  <dialog id="invite">
    <form method="dialog">
      <h2 id="invite-title">Rejoindre un salon</h2>
      <p id="invite-text"></p>
      <input id="invite-link" placeholder="Colle le lien reçu" autocomplete="off">
      <label class="field" id="invite-pseudo-field">Ton pseudo<input id="invite-pseudo" maxlength="15" placeholder="Unknown Soldier" autocomplete="nickname"></label>
      <div class="dialog-actions">
        <button class="ghost" value="cancel">Annuler</button>
        <button class="play" id="invite-go" value="go">REJOINDRE</button>
      </div>
    </form>
  </dialog>
</body>
</html>
