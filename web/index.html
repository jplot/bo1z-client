<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <base href="/bo1z/">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Zombies</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" crossorigin>
  <link rel="stylesheet" href="menu.css">
  <script type="module" src="menu.js"></script>
</head>
<body>
  <div class="bg"><div></div><div></div></div>
  <div class="shade"></div>
  <div class="grain"></div>

  <div class="app">
    <header>
      <div class="logo">ZOMBIES<span>.</span><small>BLACK OPS · DANS TON NAVIGATEUR</small></div>
      <div class="chip"><label for="pseudo">Pseudo</label><input id="pseudo" maxlength="15" placeholder="Unknown Soldier" autocomplete="nickname"></div>
    </header>

    <div class="bar-top" role="tablist">
      <button class="tab" id="tab-solo" type="button" role="tab" aria-selected="true">Solo</button>
      <button class="tab" id="tab-multi" type="button" role="tab" aria-selected="false">Multijoueur<em id="count"></em></button>
      <div class="creating" id="creating" hidden><span class="tab" aria-selected="true">Créer un salon</span><small>Choisis la carte</small></div>
      <div class="bar-end">
        <div class="views" id="views" role="group" aria-label="Affichage des cartes">
          <button type="button" data-view="grid" aria-pressed="true" title="Mosaïque" aria-label="Mosaïque"><svg viewBox="0 0 18 18"><rect x="1" y="1" width="7" height="7"/><rect x="10" y="1" width="7" height="7"/><rect x="1" y="10" width="7" height="7"/><rect x="10" y="10" width="7" height="7"/></svg></button>
          <button type="button" data-view="list" aria-pressed="false" title="Liste" aria-label="Liste"><svg viewBox="0 0 18 18"><rect x="1" y="2" width="16" height="3"/><rect x="1" y="7.5" width="16" height="3"/><rect x="1" y="13" width="16" height="3"/></svg></button>
        </div>
        <button class="switch" id="hell" type="button" role="switch" aria-checked="false"><i></i>Mode Enfer</button>
        <button class="ghost bar-btn" id="open-code" type="button" hidden>Rejoindre avec un code</button>
        <button class="ghost bar-btn" id="create" type="button" hidden>+ Créer un salon</button>
        <button class="ghost bar-btn" id="cancel-pick" type="button" hidden>Annuler</button>
      </div>
    </div>

    <section class="pane" id="pane-solo" aria-label="Cartes">
      <div id="maps"></div>
      <p class="describe" id="describe"></p>
    </section>
    <section class="pane" id="pane-multi" aria-label="Salons" hidden><div id="rooms"></div></section>

    <footer>
      <span class="k-main"><kbd>1</kbd>Solo</span>
      <span class="k-main"><kbd>2</kbd>Multijoueur</span>
      <span class="k-main"><kbd>E</kbd>Mode Enfer</span>
      <span id="k-cancel" hidden><kbd>Échap</kbd>Annuler</span>
      <span class="credits">Moteur KisakBlack (GPL-3.0) · portage web vel.gg</span>
    </footer>
  </div>

  <dialog class="joincode" id="joincode">
    <form method="dialog">
      <h2>Rejoindre un salon</h2>
      <p class="or">Tape le code donné par l’hôte</p>
      <div class="code" role="group" aria-label="Code du salon">
        <input autocomplete="off" spellcheck="false" aria-label="Lettre 1"><input autocomplete="off" spellcheck="false" aria-label="Lettre 2"><input autocomplete="off" spellcheck="false" aria-label="Lettre 3"><input autocomplete="off" spellcheck="false" aria-label="Lettre 4">
      </div>
      <p class="code-note" id="code-note"></p>
      <div class="actions"><button class="ghost join" id="join-code" type="button" disabled>Rejoindre</button><button class="ghost" type="submit">Retour</button></div>
    </form>
  </dialog>
</body>
</html>
