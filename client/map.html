<!doctype html>
<html lang="fr" data-map="{{zone}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>{{name}}</title>
  <!-- Shared-link preview: server/pages.ts fills in the map name. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BO1 Zombies">
  <meta property="og:title" content="{{name}} | BO1 Zombies">
  <meta property="og:description" content="Black Ops zombies in your browser.">
  <meta property="og:image" content="https://vel.gg/bo1z/art/og-mapselect.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="art/loadscreen_{{zone}}.webp">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" crossorigin>
  <script type="module" src="./map/main.ts"></script>
</head>
<body>
  <canvas id="game" width="1280" height="720" tabindex="0" aria-label="{{name}}"></canvas>
  <div id="screen"></div>
</body>
</html>
